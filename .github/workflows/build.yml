name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repo contents (debug)
        run: |
          echo "--- Repo root contents ---"
          ls -la

      - name: Unzip project (auto-detect zip name)
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          else
            echo "ERROR: no .zip file found in repo root!"
            exit 1
          fi
          echo "--- After unzip ---"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        working-directory: CMCNewsNotifier
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: CMCNewsNotifier/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
